<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Free Nassau: a pirate deck builder</title>
<style>
:root{--ink:#3b2a1a;--parch:#f1e2c0;--dark:#1d2b36;--sea:#24465a;--gold:#c9a24a;--red:#9b2d20}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:Georgia,'Times New Roman',serif;color:var(--ink);background:var(--dark) url(img/nassau-day9.jpg) center/cover fixed;min-height:100vh}
#app{max-width:760px;margin:0 auto;min-height:100vh;background:rgba(241,226,192,.95);padding:10px 10px 20px;box-shadow:0 0 40px #000;position:relative;border-left:4px double #7a5a2c;border-right:4px double #7a5a2c}
h1,h2,h3{margin:.35em 0;font-variant:small-caps;letter-spacing:1px}h1{text-align:center;color:var(--red)}h2{border-bottom:1px solid #a88a52;padding-bottom:3px}
button{font-family:inherit;font-size:15px;background:var(--sea);color:#f6ecd2;border:2px solid var(--gold);border-radius:8px;padding:9px 12px;margin:4px;cursor:pointer;min-height:44px}
button:disabled{opacity:.45}button.gold{background:#7a4f12}button.mini{min-height:28px;padding:2px 6px;font-size:12px}
.center{text-align:center}.small{font-size:12px;opacity:.85}.msg{background:#fff6;border-left:4px solid var(--gold);padding:6px;border-radius:4px}
.row{display:flex;align-items:center;gap:10px}
.portrait{width:64px;height:64px;border-radius:50%;object-fit:cover;border:3px solid var(--gold);flex:none}.portrait.sm{width:44px;height:44px}
.banner{width:100%;max-height:170px;object-fit:cover;border-radius:8px}
.hud{background:#e3cf9f;border:1px solid #a88a52;border-radius:8px;padding:6px 8px;font-size:13px;margin-right:46px}
.hpbar{height:7px;background:#5a1d14;border-radius:4px;overflow:hidden;margin:2px 0 3px}.hpbar i{display:block;height:100%;background:#c0392b}.hpbar.hull i{background:#7a5a2c}.hpbar.mor i{background:#3d6b34}
.cargo{margin-top:3px}.cargo span{margin-right:4px}
.offs{margin-top:3px}.chip{display:inline-block;font-size:11px;background:#fff7;border-radius:10px;padding:1px 6px;margin:1px}.chip.inj{background:#e9a89a}.chip.empty{opacity:.5}
.menubtn{position:absolute;top:8px;right:8px;min-height:36px;padding:4px 10px;font-size:20px}
.cards{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:8px 0}
.card{width:31%;max-width:118px;min-height:122px;background:linear-gradient(#fbf3dd,#e8d4a4);border:2px solid #7a5a2c;border-radius:10px;padding:6px;font-size:11.5px;position:relative;cursor:pointer;box-shadow:2px 3px 6px rgba(0,0,0,.35);user-select:none}
.card.tagS{border-color:var(--sea)}.card.tagC{border-color:var(--red)}.card.tagK{border-color:#b8860b;background:linear-gradient(#fff6d6,#ecd58e)}
.card .cost{position:absolute;top:-8px;left:-8px;width:26px;height:26px;border-radius:50%;background:var(--gold);font-weight:bold;display:flex;align-items:center;justify-content:center;border:2px solid #5a3e14}
.card .tg{font-size:9.5px;text-align:right;text-transform:uppercase;opacity:.75}.card .nm{font-weight:bold;font-size:12.5px;text-align:center;margin:3px 0}
.card.off{opacity:.38;filter:grayscale(1)}.card.dim{opacity:.6}
.cardwrap{width:31%;max-width:118px;display:flex;flex-direction:column}.cardwrap .card{width:100%;max-width:none;flex:1}.price{text-align:center;font-size:13px;font-weight:bold}
.enemy{background:linear-gradient(#e3cb94,#cfb276);border:2px solid #6b4a1f;border-radius:10px;padding:8px;margin:6px 0}
.intent{font-weight:bold;background:#fff5;padding:4px 8px;border-radius:6px;display:inline-block;margin-top:4px}
.phase{background:var(--sea);color:#f6ecd2;border-radius:6px;padding:4px 8px;font-size:12.5px;margin-top:6px}
.me{font-size:13.5px;margin-top:4px}
.tag{font-size:11px;background:#fff6;border-radius:4px;padding:1px 4px;margin-left:3px}
.log{font-size:12px;max-height:90px;overflow:auto;background:#fff5;border-radius:6px;padding:4px}
.map{background:url(img/map-bahamas-florida-straits.jpg) center/cover;border:3px solid #6b4a1f;border-radius:10px;padding:6px}
.maprow{display:flex;justify-content:space-around;margin:7px 0}
.node{width:50px;height:50px;border-radius:50%;background:#f1e2c0;border:3px solid #6b4a1f;font-size:23px;display:flex;align-items:center;justify-content:center;opacity:.6}
.node.avail{opacity:1;border-color:var(--gold);box-shadow:0 0 12px var(--gold);cursor:pointer;animation:pulse 1.2s infinite}.node.done{background:#9a8a6a}.node.cur{outline:3px solid var(--red)}.node.empty{visibility:hidden}
@keyframes pulse{50%{transform:scale(1.08)}}
.actions{display:flex;flex-wrap:wrap;justify-content:center;margin:14px 0 4px;padding:8px;border-top:2px dashed #a88a52}
.choices{display:flex;flex-wrap:wrap;gap:2px}.choices button{flex:1 1 45%;text-align:left}
.panel{background:#fff5;border:1px solid #a88a52;border-radius:8px;padding:8px;margin:8px 0}.dimmed{opacity:.55}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:9;padding:12px}
.modal .box{background:var(--parch);border:3px solid var(--gold);border-radius:12px;max-width:540px;max-height:85vh;overflow:auto;padding:14px;font-size:13.5px}.modal dt{font-weight:bold;margin-top:6px}.modal dd{margin:0 0 4px 10px}
ul{padding-left:20px}
</style></head><body><div id="app"></div><div id="modal"></div>
<script src="game.js?v=2"></script><script src="ui.js?v=2"></script></body></html>
