<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Free Nassau: The Endurance's Run</title>
<style>
:root{--ink:#3b2a1a;--parch:#f1e2c0;--dark:#1d2b36;--sea:#24465a;--gold:#c9a24a;--red:#9b2d20}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:Georgia,'Times New Roman',serif;color:var(--ink);background:var(--dark) url(img/nassau-day9.jpg) center/cover fixed;min-height:100vh}
#app{max-width:760px;margin:0 auto;min-height:100vh;background:rgba(241,226,192,.94);padding:10px 10px 90px;box-shadow:0 0 40px #000}
h1,h2,h3{margin:.3em 0;font-variant:small-caps;letter-spacing:1px}
h1{text-align:center;color:var(--red)}
button{font-family:inherit;font-size:16px;background:var(--sea);color:#f6ecd2;border:2px solid var(--gold);border-radius:8px;padding:10px 14px;margin:4px;cursor:pointer;min-height:44px}
button:disabled{opacity:.45}
.bar{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:14px;background:#e3cf9f;border:1px solid #a88a52;border-radius:8px;padding:6px 8px;align-items:center}
.bar b{color:var(--red)}
.portrait{width:64px;height:64px;border-radius:50%;object-fit:cover;border:3px solid var(--gold)}
.row{display:flex;align-items:center;gap:10px}
.cards{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:8px 0}
.card{width:108px;min-height:150px;background:linear-gradient(#fbf3dd,#e8d4a4);border:2px solid #7a5a2c;border-radius:10px;padding:6px;font-size:12px;position:relative;cursor:pointer;box-shadow:2px 3px 6px rgba(0,0,0,.35);user-select:none}
.card.attack{border-color:var(--red)}.card.block{border-color:var(--sea)}.card.skill{border-color:#3d6b34}
.card .cost{position:absolute;top:-8px;left:-8px;width:26px;height:26px;border-radius:50%;background:var(--gold);color:#000;font-weight:bold;display:flex;align-items:center;justify-content:center;border:2px solid #5a3e14}
.card .nm{font-weight:bold;font-size:13px;text-align:center;margin:6px 0 4px}
.card .ty{font-size:10px;text-align:center;text-transform:uppercase;opacity:.7}
.card.unplayable{opacity:.5}
.card:active{transform:translateY(-4px)}
.enemy{background:#d9c08a;border:2px solid #6b4a1f;border-radius:10px;padding:8px;margin:8px 0}
.hpbar{height:12px;background:#5a1d14;border-radius:6px;overflow:hidden;margin:4px 0}
.hpbar i{display:block;height:100%;background:#c0392b}
.intent{font-weight:bold;background:#fff4;padding:4px 8px;border-radius:6px;display:inline-block}
.log{font-size:12px;max-height:70px;overflow:auto;background:#fff5;border-radius:6px;padding:4px;margin-top:6px}
.map{background:url(img/map-bahamas-florida-straits.jpg) center/cover;border:3px solid #6b4a1f;border-radius:10px;padding:8px;position:relative}
.maprow{display:flex;justify-content:space-around;margin:10px 0}
.node{width:56px;height:56px;border-radius:50%;background:#f1e2c0;border:3px solid #6b4a1f;font-size:26px;display:flex;align-items:center;justify-content:center;opacity:.55}
.node.avail{opacity:1;border-color:var(--gold);box-shadow:0 0 12px var(--gold);cursor:pointer;animation:pulse 1.2s infinite}
.node.done{opacity:.9;background:#9a8a6a}.node.empty{visibility:hidden}
@keyframes pulse{50%{transform:scale(1.08)}}
.ship{width:100%;max-height:170px;object-fit:cover;border-radius:8px}
.footer{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;background:rgba(29,43,54,.92);padding:6px}
.tag{font-size:11px;background:#fff6;border-radius:4px;padding:1px 4px;margin-left:3px}
.dice{font-size:22px}
.center{text-align:center}
.relic{display:inline-flex;align-items:center;gap:4px;background:#fff6;border-radius:6px;padding:2px 6px;font-size:12px}
.relic img{width:22px;height:22px;border-radius:4px;object-fit:cover}
</style></head><body><div id="app"></div><div class="footer" id="footer"></div>
<script>
"use strict";
const SAVE='freeNassauDeckRunV1';
const rnd=n=>Math.floor(Math.random()*n);
const d6=()=>{let r=1+rnd(6);if(S.relics.includes('doubloon')&&r<2)r=2;return r};
const pick=a=>a[rnd(a.length)];
const CARDS={
 strike:{n:'Cutlass Strike',t:'attack',c:1,d:'Deal 6 damage.',f:g=>hit(6)},
 defend:{n:'Brace',t:'block',c:1,d:'Gain 5 Block.',f:g=>blk(5)},
 broadside:{n:'Broadside',t:'attack',c:2,d:'Deal 14 damage.',f:g=>hit(14)},
 flurry:{n:'Cutlass Flurry',t:'attack',c:1,d:'Deal 3 damage 3 times.',f:g=>{hit(3);hit(3);hit(3)}},
 chain:{n:'Chain Shot',t:'attack',c:1,d:'Deal 5 damage. Enemy Weak 2 (deals 25% less).',f:g=>{hit(5);E().weak+=2}},
 grape:{n:'Grapeshot',t:'attack',c:1,d:'Deal 4 damage. Apply 2 Vulnerable (takes 50% more).',f:g=>{hit(4);E().vuln+=2}},
 keg:{n:'Powder Keg',t:'attack',c:2,d:'Roll 2 dice. Deal the total ×2 damage.',f:g=>{const a=d6(),b=d6();log(`🎲 ${a} + ${b}`);hit((a+b)*2)}},
 lucky:{n:'Lucky Shot',t:'attack',c:0,d:'Roll a die. Deal that much damage; on a 6 deal 15.',f:g=>{const r=d6();log(`🎲 ${r}`);hit(r==6?15:r)}},
 hooks:{n:'Boarding Hooks',t:'attack',c:1,d:'Deal 7 damage. +5 if the enemy has no Block.',f:g=>hit(E().block>0?7:12)},
 charge:{n:'Gunpowder Charge',t:'attack',c:1,d:'Deal 13 damage. Take 3 damage.',f:g=>{hit(13);S.hp-=3}},
 volley:{n:'Musket Volley',t:'attack',c:2,d:'Deal 5 damage 4 times.',f:g=>{for(let i=0;i<4;i++)hit(5)}},
 sails:{n:'Hoist Sails',t:'block',c:1,d:'Gain 7 Block. Draw 1 card.',f:g=>{blk(7);draw(1)}},
 timber:{n:'Timber Patch',t:'block',c:2,d:'Gain 13 Block.',f:g=>blk(13)},
 fortune:{n:'Dice of Fortune',t:'block',c:1,d:'Roll a die. Gain 3× that in Block.',f:g=>{const r=d6();log(`🎲 ${r}`);blk(r*3)}},
 rope:{n:'Rope & Rigging',t:'block',c:1,d:'Gain 4 Block. Next turn, gain 4 Block.',f:g=>{blk(4);C().nextBlock+=4}},
 rum:{n:'Rum Ration',t:'skill',c:0,d:'Heal 4 HP. Exhaust.',x:1,f:g=>heal(4)},
 kidd:{n:"Kidd's Counsel",t:'skill',c:1,d:'James advises: draw 2, gain 1 energy. Exhaust.',x:1,f:g=>{draw(2);C().energy+=1}},
 sight:{n:'Spyglass Sighting',t:'skill',c:0,d:'Draw 1 card.',f:g=>draw(1)},
 resolve:{n:"Captain's Resolve",t:'skill',c:1,d:'Gain 2 Strength (attacks +2 per hit). Exhaust.',x:1,f:g=>{C().str+=2}},
 rally:{n:'Rally the Crew',t:'skill',c:1,d:'Gain 1 Strength and 5 Block.',f:g=>{C().str+=1;blk(5)}},
};
const REWARD_POOL=Object.keys(CARDS).filter(k=>k!='strike'&&k!='defend');
const RELICS={
 spyglass:{n:"James's Spyglass",img:'img/james-spyglass.jpg',d:'Draw 2 extra cards on the first turn of each fight.'},
 colors:{n:"Fair Wind's Colors",img:'img/endurance.jpg',d:'Start each fight with 6 Block.'},
 doubloon:{n:'Lucky Doubloon',img:'img/nassau-day9.jpg',d:'Dice never roll below 2.'},
 cask:{n:'Rum Cask',img:'img/nassau-day9.jpg',d:'Heal 5 HP after each fight.'},
};
const ENEMIES={
 pirates:{n:'Rival Pirates',hp:34,img:'img/endurance.jpg',pat:[['atk',7],['blk',6],['atk',4,2]]},
 navy:{n:'Navy Frigate',hp:46,img:'img/endurance.jpg',pat:[['atk',11],['buf',2],['atk',6],['blk',10]]},
 boarders:{n:'Boarding Party',hp:28,img:'img/endurance.jpg',pat:[['atk',3,3],['atk',5,2],['debuf',2]]},
 boss:{n:"Navy Man-o'-War",hp:110,img:'img/endurance.jpg',boss:1,pat:[['atk',8,2],['blk',15],['atk',22],['buf',3],['atk',5,4]]},
};
const ICON={fight:'⚔️',merchant:'💰',rest:'🍺',event:'❓',elite:'☠️',boss:'⛵'};
const NAME={fight:'Fight',merchant:'Merchant',rest:'Tavern',event:'Strange Sail',elite:'Navy Frigate',boss:"Man-o'-War"};
let S=null;
function newRun(){
 S={hp:60,maxHp:60,coin:60,cargo:{silver:0,timber:1,food:2,water:2,gunpowder:1,rum:1,wine:0,rope:1},
  deck:['strike','strike','strike','strike','strike','defend','defend','defend','defend','lucky','sails'],
  relics:['spyglass'],map:genMap(),row:-1,col:-1,screen:'map',combat:null,msg:'',stats:{fights:0}};
 save();render();
}
function genMap(){
 const rows=[];const types=['fight','fight','event','merchant','fight','rest','event','elite','fight','merchant'];
 for(let r=0;r<7;r++){const row=[];for(let c=0;c<3;c++){let t;
  if(r==0)t='fight';else if(r==6)t='rest';else if(r==4&&c==1)t='merchant';else t=pick(types);
  row.push({t,done:0})} rows.push(row)}
 rows.push([{t:'empty'},{t:'boss',done:0},{t:'empty'}]);return rows;
}
function avail(r,c){if(S.screen!='map')return false;
 if(r==S.row+1){if(r==7)return c==1; if(S.row<0)return true; return Math.abs(c-S.col)<=1}return false}
function save(){try{localStorage.setItem(SAVE,JSON.stringify(S))}catch(e){}}
function load(){try{const j=localStorage.getItem(SAVE);if(j)return JSON.parse(j)}catch(e){}return null}
const C=()=>S.combat, E=()=>S.combat.enemy;
function log(m){C().log.unshift(m);if(C().log.length>30)C().log.pop()}
function hit(n){const c=C(),e=E();let d=n+c.str;if(c.pweak>0)d=Math.floor(d*.75);if(e.vuln>0)d=Math.floor(d*1.5);
 const ab=Math.min(e.block,d);e.block-=ab;e.hp-=d-ab;log(`You hit for ${d}${ab?` (${ab} blocked)`:''}.`)}
function blk(n){C().block+=n}
function heal(n){S.hp=Math.min(S.maxHp,S.hp+n)}
function draw(n){const c=C();for(let i=0;i<n;i++){if(!c.draw.length){c.draw=shuffle(c.disc);c.disc=[]}if(!c.draw.length)return;if(c.hand.length>=10)return;c.hand.push(c.draw.pop())}}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
function startFight(kind){
 const base=ENEMIES[kind];const scale=1+Math.max(0,S.row)*0.06;
 const e={k:kind,n:base.n,max:Math.round(base.hp*(base.boss?1:scale)),block:0,str:0,weak:0,vuln:0,i:rnd(base.pat.length)};e.hp=e.max;
 S.combat={enemy:e,draw:shuffle(S.deck),disc:[],hand:[],exh:[],energy:3,block:0,str:0,pweak:0,turn:0,nextBlock:0,log:[`${e.n} sighted!`]};
 if(S.relics.includes('colors'))S.combat.block=6;
 S.screen='combat';startTurn();
}
function startTurn(){const c=C();c.turn++;c.energy=3;if(c.turn>1)c.block=0;c.block+=c.nextBlock;c.nextBlock=0;
 draw(5+(c.turn==1&&S.relics.includes('spyglass')?2:0));save();render()}
function play(i){const c=C();const k=c.hand[i];const cd=CARDS[k];if(cd.c>c.energy)return;
 c.energy-=cd.c;c.hand.splice(i,1);cd.f();(cd.x?c.exh:c.disc).push(k);
 if(!checkEnd()){save();render()}}
function intent(e){const p=ENEMIES[e.k].pat[e.i];const s=e.str;let w=x=>e.weak>0?Math.floor(x*.75):x;
 if(p[0]=='atk')return{ic:'⚔️',tx:`Attack ${w(p[1]+s)}${p[2]?' × '+p[2]:''}`};
 if(p[0]=='blk')return{ic:'🛡️',tx:`Defend ${p[1]}`};if(p[0]=='buf')return{ic:'💪',tx:`Load guns (+${p[1]} Str)`};return{ic:'🌀',tx:`Weaken you (${p[1]})`}}
function endTurn(){const c=C(),e=E();c.disc.push(...c.hand);c.hand=[];
 e.block=0;const p=ENEMIES[e.k].pat[e.i];
 if(p[0]=='atk'){for(let t=0;t<(p[2]||1);t++){let d=p[1]+e.str;if(e.weak>0)d=Math.floor(d*.75);const ab=Math.min(c.block,d);c.block-=ab;S.hp-=d-ab;log(`${e.n} hits for ${d}${ab?` (${ab} blocked)`:''}.`)}}
 else if(p[0]=='blk'){e.block+=p[1];log(`${e.n} braces (+${p[1]} Block).`)}
 else if(p[0]=='buf'){e.str+=p[1];log(`${e.n} loads heavier shot.`)}
 else {c.pweak+=p[1];log(`${e.n} rattles your crew (Weak ${p[1]}).`)}
 e.i=(e.i+1)%ENEMIES[e.k].pat.length;if(e.weak>0)e.weak--;if(e.vuln>0)e.vuln--;if(c.pweak>0)c.pweak--;
 if(!checkEnd())startTurn()}
function checkEnd(){const e=E();
 if(S.hp<=0){S.hp=0;S.screen='lose';S.combat=null;save();render();return true}
 if(e.hp<=0){const boss=ENEMIES[e.k].boss,elite=e.k=='navy';S.combat=null;S.stats.fights++;
  if(boss){S.screen='win';save();render();return true}
  const coin=elite?40+rnd(15):15+rnd(15);S.coin+=coin;const cg=pick(Object.keys(S.cargo));S.cargo[cg]+=1;
  if(S.relics.includes('cask'))heal(5);
  let msg=`Victory! +${coin} coin, +1 ${cg}.`;
  if(elite){const r=Object.keys(RELICS).filter(k=>!S.relics.includes(k));if(r.length){const g=pick(r);S.relics.push(g);msg+=` Relic found: ${RELICS[g].n}!`}}
  S.reward={msg,cards:shuffle(REWARD_POOL).slice(0,3)};S.screen='reward';save();render();return true}
 return false}
function takeReward(k){if(k)S.deck.push(k);S.reward=null;S.screen='map';save();render()}
function go(r,c){if(!avail(r,c))return;S.row=r;S.col=c;const n=S.map[r][c];n.done=1;
 if(n.t=='fight')startFight(pick(['pirates','boarders']));
 else if(n.t=='elite')startFight('navy');else if(n.t=='boss')startFight('boss');
 else if(n.t=='merchant'){S.shop={cards:shuffle(REWARD_POOL).slice(0,4).map(k=>({k,p:40+rnd(30)})),removed:0,relic:pick(Object.keys(RELICS).filter(k=>!S.relics.includes(k)).concat(['']))};S.screen='merchant'}
 else if(n.t=='rest')S.screen='rest';else if(n.t=='event'){S.ev=rnd(EVENTS.length);S.screen='event'}
 save();render()}
const EVENTS=[
 {t:'A Drifting Wreck',d:'A merchant wreck wallows on the swell, her hold half-flooded.',o:[['Salvage the hold (lose 6 HP, +2 silver, +1 timber)',()=>{S.hp=Math.max(1,S.hp-6);S.cargo.silver+=2;S.cargo.timber++}],['Leave her to the sea',()=>{}]]},
 {t:'Ren and James at the Rail',d:'James Kidd lowers the spyglass. "Calm water ahead, Ren. Or we could try the shoals and save a day."',o:[['Take the calm water (heal 10)',()=>heal(10)],['Run the shoals (+1 Strength card: Captain\'s Resolve)',()=>S.deck.push('resolve')]]},
 {t:'A Merchant in Distress',d:'A Merchant has lost her mast and begs for help.',o:[['Give rope and timber (-1 rope, -1 timber, +45 coin)',()=>{if(S.cargo.rope>0&&S.cargo.timber>0){S.cargo.rope--;S.cargo.timber--;S.coin+=45}else S.msg='Not enough cargo; you sail on.'}],['Take her rum (+2 rum, add a Rum Ration)',()=>{S.cargo.rum+=2;S.deck.push('rum')}]]},
 {t:'The Fair Wind Signals',d:'The captured Dutch snow, the Fair Wind, runs up a signal: she has spare powder.',o:[['Take on gunpowder (+2 gunpowder, add Powder Keg)',()=>{S.cargo.gunpowder+=2;S.deck.push('keg')}],['Trade it for coin (+30 coin)',()=>S.coin+=30]]},
];
function sellCargo(k){const val={silver:25,wine:12,rum:8,gunpowder:10,timber:6,rope:5,food:4,water:3}[k];if(S.cargo[k]>0){S.cargo[k]--;S.coin+=val;save();render()}}
function buy(i){const it=S.shop.cards[i];if(!it||it.sold||S.coin<it.p)return;S.coin-=it.p;it.sold=1;S.deck.push(it.k);save();render()}
function buyRelic(){if(!S.shop.relic||S.coin<100)return;S.coin-=100;S.relics.push(S.shop.relic);S.shop.relic='';save();render()}
function removeCard(i){const cost=50+25*S.shop.removed;if(S.coin<cost||S.deck.length<=5)return;S.coin-=cost;S.shop.removed++;S.deck.splice(i,1);S.screen='merchant';save();render()}
const $=id=>document.getElementById(id);
function cardHTML(k,attrs='',extra=''){const c=CARDS[k];return `<div class="card ${c.t} ${extra}" ${attrs}><div class="cost">${c.c}</div><div class="nm">${c.n}</div><div class="ty">${c.t}</div><div>${c.d}</div></div>`}
function topBar(){const cg=Object.entries(S.cargo).filter(x=>x[1]>0).map(([k,v])=>`${k} ${v}`).join(' · ');
 return `<div class="bar"><img class="portrait" src="img/ren.jpg" style="width:40px;height:40px"><span>Ren ❤️ <b>${S.hp}/${S.maxHp}</b></span><span>💰 <b>${S.coin}</b></span><span>🃏 ${S.deck.length}</span><span style="font-size:12px">📦 ${cg||'empty hold'}</span>
 <span>${S.relics.map(r=>`<span class="relic" title="${RELICS[r].d}" onclick="alert('${RELICS[r].n}: ${RELICS[r].d.replace(/'/g,"\\'")}')"><img src="${RELICS[r].img}">${RELICS[r].n}</span>`).join(' ')}</span></div>`}
function render(){const a=$('app'),f=$('footer');f.innerHTML='';
 if(!S){const sv=load();a.innerHTML=`<h1>Free Nassau</h1><h3 class="center">The Endurance's Run</h3><img class="ship" src="img/endurance.jpg"><p>Captain Ren sails the sloop <i>Endurance</i> out of Nassau, with James Kidd at his side. Chart a course across the islands, fight, trade, and break the Navy Man-o'-War that threatens the free city.</p><div class="center">${sv?'<button id="cont" onclick="S=load();render()">Continue Voyage</button>':''}<button id="new" onclick="newRun()">New Voyage</button></div><p style="font-size:13px"><b>How to play:</b> tap nodes on the map to sail. In fights, tap cards to play them (each costs ⚡ energy, 3 per turn), then tap End Turn. Read the enemy's intent to know when to Block. Your run saves automatically.</p>`;return}
 let h=topBar();
 if(S.screen=='map'){h+=`<h2>Chart Your Course</h2>${S.msg?`<p><i>${S.msg}</i></p>`:''}<div class="map">`;S.msg='';
  for(let r=S.map.length-1;r>=0;r--){h+='<div class="maprow">';S.map[r].forEach((n,c)=>{const av=avail(r,c);h+=n.t=='empty'?'<div class="node empty"></div>':`<div class="node ${av?'avail':''} ${n.done?'done':''} ${r==S.row&&c==S.col?'done':''}" data-r="${r}" data-c="${c}" title="${NAME[n.t]}" onclick="go(${r},${c})">${ICON[n.t]}</div>`});h+='</div>'}
  h+=`</div><p style="font-size:12px">⚔️ Fight · ☠️ Navy Frigate (elite, relic) · 💰 Merchant · 🍺 Tavern · ❓ Event · ⛵ Boss</p>`;
  f.innerHTML=`<button onclick="showDeck()">View Deck</button><button onclick="if(confirm('Abandon this voyage?')){localStorage.removeItem(SAVE);S=null;render()}">Abandon</button>`}
 else if(S.screen=='combat'){const c=C(),e=E(),it=intent(e);
  h+=`<div class="enemy"><div class="row"><img class="portrait" src="${ENEMIES[e.k].img}"><div style="flex:1"><h3>${e.n}</h3><div class="hpbar"><i style="width:${Math.max(0,e.hp)/e.max*100}%"></i></div>${Math.max(0,e.hp)}/${e.max} ${e.block?`<span class="tag">🛡️ ${e.block}</span>`:''}${e.str?`<span class="tag">💪 ${e.str}</span>`:''}${e.weak?`<span class="tag">Weak ${e.weak}</span>`:''}${e.vuln?`<span class="tag">Vuln ${e.vuln}</span>`:''}</div></div><div class="intent" id="intent">Intent: ${it.ic} ${it.tx}</div></div>
  <div class="row"><img class="portrait" src="img/ren.jpg"><div><b>Ren</b> ❤️ ${S.hp}/${S.maxHp} <span class="tag">🛡️ ${c.block}</span>${c.str?`<span class="tag">💪 ${c.str}</span>`:''}${c.pweak?`<span class="tag">Weak ${c.pweak}</span>`:''}<br>⚡ Energy <b id="energy">${c.energy}</b>/3 · Draw ${c.draw.length} · Discard ${c.disc.length}</div></div>
  <div class="cards" id="hand">${c.hand.map((k,i)=>cardHTML(k,`data-i="${i}" onclick="play(${i})"`,CARDS[k].c>c.energy?'unplayable':'')).join('')}</div>
  <div class="log">${c.log.join('<br>')}</div>`;
  f.innerHTML=`<button id="endturn" onclick="endTurn()">End Turn ⏳</button>`}
 else if(S.screen=='reward'){h+=`<h2>${S.reward.msg}</h2><p>Choose a card to add to your deck:</p><div class="cards">${S.reward.cards.map(k=>cardHTML(k,`onclick="takeReward('${k}')"`,'rw')).join('')}</div><div class="center"><button id="skip" onclick="takeReward()">Skip</button></div>`}
 else if(S.screen=='merchant'){const sh=S.shop,rc=50+25*sh.removed;
  h+=`<h2>💰 The Merchant</h2><img class="ship" src="img/nassau-day9.jpg"><h3>Cards</h3><div class="cards">${sh.cards.map((it,i)=>it.sold?'':`<div>${cardHTML(it.k,`onclick="buy(${i})"`,S.coin<it.p?'unplayable':'')}<div class="center">${it.p} coin</div></div>`).join('')}</div>
  ${sh.relic?`<h3>Relic</h3><button onclick="buyRelic()" ${S.coin<100?'disabled':''}>${RELICS[sh.relic].n}: ${RELICS[sh.relic].d} (100 coin)</button>`:''}
  <h3>Sell Cargo</h3>${Object.entries(S.cargo).filter(x=>x[1]>0).map(([k,v])=>`<button onclick="sellCargo('${k}')">Sell ${k} (${v})</button>`).join('')||'Hold is empty.'}
  <h3>Remove a card</h3><button onclick="S.screen='remove';render()" ${S.coin<rc?'disabled':''}>Remove a card (${rc} coin)</button>`;
  f.innerHTML=`<button id="leave" onclick="S.screen='map';save();render()">Set Sail</button>`}
 else if(S.screen=='remove'){h+=`<h2>Remove which card?</h2><div class="cards">${S.deck.map((k,i)=>cardHTML(k,`onclick="removeCard(${i})"`)).join('')}</div>`;f.innerHTML=`<button onclick="S.screen='merchant';render()">Back</button>`}
 else if(S.screen=='rest'){h+=`<h2>🍺 A Quiet Tavern</h2><img class="ship" src="img/nassau-day9.jpg"><p>Ren and James Kidd share a bottle while the crew sleeps ashore.</p><button id="rest" onclick="heal(Math.ceil(S.maxHp*.3));S.screen='map';save();render()">Rest (heal ${Math.ceil(S.maxHp*.3)})</button><button onclick="S.maxHp+=5;S.hp+=5;S.screen='map';save();render()">Drill the crew (+5 max HP)</button>`}
 else if(S.screen=='event'){const ev=EVENTS[S.ev];h+=`<h2>❓ ${ev.t}</h2><img class="ship" src="img/${S.ev==1?'james-kidd':'endurance'}.jpg" style="${S.ev==1?'max-height:220px;object-fit:contain':''}"><p>${ev.d}</p>${ev.o.map((o,i)=>`<button class="evopt" onclick="EVENTS[${S.ev}].o[${i}][1]();S.screen='map';save();render()">${o[0]}</button>`).join('<br>')}`}
 else if(S.screen=='win'||S.screen=='lose'){const w=S.screen=='win';h=`<h1>${w?'Victory!':'The Endurance Founders'}</h1><img class="ship" src="img/${w?'nassau-day9':'endurance'}.jpg"><p class="center">${w?"The Man-o'-War strikes her colours. Nassau stays free, and Ren sails home with James Kidd at his side.":'Ren goes down fighting. Nassau will need another captain... or another run.'}</p><p class="center">Fights won: ${S.stats.fights} · Coin: ${S.coin}</p><div class="center"><button id="again" onclick="localStorage.removeItem(SAVE);newRun()">New Voyage</button></div>`}
 a.innerHTML=h}
function showDeck(){const a=$('app');a.innerHTML=topBar()+`<h2>Your Deck</h2><div class="cards">${S.deck.slice().sort().map(k=>cardHTML(k)).join('')}</div>`;$('footer').innerHTML=`<button onclick="render()">Back</button>`}
render();
</script></body></html>
